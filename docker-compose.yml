services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coffee
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # *.sql files here run in filename order, only when the volume is first created.
      # Run `make db-reset` after adding or changing them.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coffee"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
